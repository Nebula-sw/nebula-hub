<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Nebula 로고 1 vs 5</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #0f0d16; color: #f1eef8; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .col { padding: 28px 24px; display: flex; flex-direction: column; gap: 22px; align-items: center; border-right: 1px solid #221e30; }
  h2 { margin: 0; font-size: 18px; }
  .lbl { font-size: 12px; color: #9a93b0; margin-bottom: 6px; align-self: flex-start; }
  .box { width: 100%; }
  /* 브라우저 탭 */
  .tabs { display: flex; gap: 2px; background: #2a2638; padding: 6px 8px 0; border-radius: 10px 10px 0 0; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 12px; color: #cfc8e4; width: 170px; }
  .tab.on { background: #15121f; color: #fff; }
  .tab.light { background: #fff; color: #1d1929; }
  .tabs.light { background: #dedae8; }
  /* 바 */
  .bar { display: flex; align-items: center; gap: 10px; height: 51px; padding: 0 16px; background: #15121f; border-bottom: 1px solid #2a2638; font-size: 14px; color: #9a93b0; }
  .bar.light { background: #fff; border-color: #e3dff0; color: #675f7f; }
  .bar b { display: flex; align-items: center; gap: 6px; font-size: 15px; color: #f1eef8; padding-right: 14px; border-right: 1px solid #2a2638; }
  .bar.light b { color: #1d1929; border-color: #e3dff0; }
  .pill { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; }
  .pill.cur { background: #2a2638; color: #f1eef8; font-weight: 700; }
  .bar.light .pill.cur { background: #ece8f6; color: #1d1929; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  /* 홈 화면 아이콘 */
  .home { display: flex; gap: 22px; padding: 18px; border-radius: 16px; background: linear-gradient(160deg, #3b2f6e, #1b1533); }
  .home.light { background: linear-gradient(160deg, #e8e1ff, #ffd9e6); }
  .app { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; }
  .app.d { background: linear-gradient(160deg, #241c44, #120e22); }
  .app.w { background: #fff; }
  .app.g { background: linear-gradient(160deg, #8b6cf6, #f0709c); }
  .home span { display: block; text-align: center; font-size: 11px; margin-top: 4px; color: #fff; }
  .home.light span { color: #1d1929; }
  /* 카톡 썸네일 */
  .og { width: 100%; aspect-ratio: 1200/630; border-radius: 12px; overflow: hidden; position: relative;
    background: radial-gradient(ellipse at 80% 10%, rgba(240,112,156,.35), transparent 55%), radial-gradient(ellipse at 10% 90%, rgba(139,108,246,.4), transparent 55%), #15121f;
    display: flex; align-items: center; gap: 22px; padding: 0 36px; box-sizing: border-box; }
  .og .t { font-size: 40px; font-weight: 800; }
  .og .s { font-size: 14px; color: #c6bfdc; margin-top: 6px; }
  .kakao { background: #b2c7d9; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; }
  .kakao .msg { background: #fff; border-radius: 10px; overflow: hidden; width: 78%; }
  .kakao .msg .og { border-radius: 0; padding: 0 20px; gap: 12px; }
  .kakao .msg .og .t { font-size: 22px; } .kakao .msg .og .s { font-size: 9px; }
  .kakao .meta { padding: 8px 10px; font-size: 12px; color: #333; } .kakao .meta small { display: block; color: #999; font-size: 10px; margin-top: 2px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="vp" gradientUnits="userSpaceOnUse" x1="2" y1="6" x2="30" y2="28"><stop offset="0" stop-color="#9a7cff"/><stop offset="1" stop-color="#f0709c"/></linearGradient>
    <linearGradient id="vp2" gradientUnits="userSpaceOnUse" x1="2" y1="8" x2="26" y2="30"><stop offset="0" stop-color="#7f65e3"/><stop offset=".55" stop-color="#b47cf0"/><stop offset="1" stop-color="#f58bb0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe794"/><stop offset="1" stop-color="#ffaa4a"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c4" stop-opacity=".8"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>

    <symbol id="star" viewBox="-1.3 -1.3 2.6 2.6" overflow="visible">
      <path d="M0.000,-1.000 L0.270,-0.372 L0.951,-0.309 L0.437,0.142 L0.588,0.809 L0.000,0.460 L-0.588,0.809 L-0.437,0.142 L-0.951,-0.309 L-0.270,-0.372Z" stroke-width=".32" stroke-linejoin="round"/>
    </symbol>
    <!-- 큰 구름 (아이콘 칸을 꽉 채우고 가운데 정렬) -->
    <g id="cloud">
      <rect x="1.5" y="16.5" width="29" height="11" rx="5.5"/>
      <circle cx="9.8" cy="17" r="6.6"/>
      <circle cx="18.8" cy="13.8" r="8.3"/>
      <circle cx="25.8" cy="19" r="4.7"/>
    </g>
    <mask id="cutBig"><rect width="32" height="32" fill="#fff"/><use href="#star" x="8" y="10" width="16" height="16" fill="#000" stroke="#000"/></mask>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c2"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>

    <!-- 1. 큰 금별 -->
    <symbol id="A" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)"/>
      <use href="#star" x="8" y="10" width="16" height="16" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>
    <!-- 2. 큰 별 구멍 -->
    <symbol id="B" viewBox="0 0 32 32">
      <g mask="url(#cutBig)"><use href="#cloud" fill="url(#vp)"/></g>
    </symbol>
    <!-- 3. 큰 흰 별 -->
    <symbol id="C" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp2)"/>
      <use href="#star" x="8" y="10" width="16" height="16" fill="#fff" stroke="#fff"/>
    </symbol>
    <!-- 4. 빛나는 큰 금별 (뒤에 후광) -->
    <symbol id="D" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp2)"/>
      <circle cx="16" cy="18" r="10" fill="url(#halo)"/>
      <use href="#star" x="8.5" y="10.5" width="15" height="15" fill="url(#pg)" stroke="url(#pg)"/>
    </symbol>
    <!-- 5. 흰 테두리 금별 -->
    <symbol id="E" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)"/>
      <use href="#star" x="8" y="10" width="16" height="16" fill="#fff" stroke="#fff" stroke-width=".7"/>
      <use href="#star" x="9.6" y="11.6" width="12.8" height="12.8" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>
    <!-- 6. 큰 봉우리 위치의 금별 (조금 오른쪽 위) -->
    <symbol id="F" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)"/>
      <use href="#star" x="11" y="8" width="16" height="16" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>
  </defs>
</svg>
<div class="cols" id="cols"></div>
<script>
  const icon = (id, s) => `<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`
  const col = (id, name) => `<div class="col">
    <h2>${name}</h2>
    <div>${icon(id, 160)}</div>
    <div class="box"><div class="lbl">브라우저 탭 (16px 파비콘)</div>
      <div class="tabs"><div class="tab on">${icon(id, 16)} 로스트아크 · Nebula</div><div class="tab">${icon(id, 16)} NIKKE · 육성 가이드</div></div>
      <div class="tabs light" style="margin-top:8px"><div class="tab light">${icon(id, 16)} 로스트아크 · Nebula</div><div class="tab">${icon(id, 16)} Nebula</div></div></div>
    <div class="box"><div class="lbl">맨 위 바</div>
      ${['', 'light'].map(t => `<div class="bar ${t}"><b>${icon(id, 24)}Nebula</b><span class="pill cur"><i class="dot" style="background:#9680f2"></i>로스트아크</span><span class="pill"><i class="dot" style="background:#e8678a"></i>니케</span></div>`).join('')}</div>
    <div class="box"><div class="lbl">휴대폰 홈 화면 아이콘 (배경 3종)</div>
      ${['', 'light'].map(t => `<div class="home ${t}" style="margin-bottom:8px">${['d', 'w', 'g'].map(b => `<div><div class="app ${b}">${icon(id, 46)}</div><span>Nebula</span></div>`).join('')}</div>`).join('')}</div>
    <div class="box"><div class="lbl">카톡 공유 썸네일</div>
      <div class="kakao"><div class="msg"><div class="og">${icon(id, 70)}<div><div class="t">로스트아크</div><div class="s">원정대 등록하면 레이드 공대를 자동으로 짜줘요</div></div></div>
      <div class="meta">로스트아크 · Nebula<small>sw.nebula.kim</small></div></div></div></div>
  </div>`
  document.getElementById('cols').innerHTML = col('A', '1. 큰 금별') + col('E', '5. 흰 테두리 금별')
</script>
</body></html>
