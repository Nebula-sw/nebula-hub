<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Nebula 로고 시안 6</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #0f0d16; color: #f1eef8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 22px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; border-bottom: 1px solid #221e30; }
  .cell.light { background: #f6f3fb; color: #1d1929; border-color: #e3dff0; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
  .tag { font-size: 13px; color: #9a93b0; text-align: center; }
  .row { display: flex; gap: 18px; align-items: center; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; padding: 8px 12px; border-radius: 8px; background: #15121f; color: #f1eef8; }
  .light .bar { background: #fff; color: #1d1929; box-shadow: 0 0 0 1px #e3dff0; }
  .app { width: 64px; height: 64px; border-radius: 15px; background: linear-gradient(160deg, #241c44, #120e22); display: grid; place-items: center; box-shadow: 0 0 0 1px #2a2638; }
  h2 { margin: 0; font-size: 15px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="vp" gradientUnits="userSpaceOnUse" x1="3" y1="12" x2="29" y2="30"><stop offset="0" stop-color="#9a7cff"/><stop offset="1" stop-color="#f0709c"/></linearGradient>
    <linearGradient id="vp2" gradientUnits="userSpaceOnUse" x1="3" y1="14" x2="24" y2="31"><stop offset="0" stop-color="#7f65e3"/><stop offset=".55" stop-color="#b47cf0"/><stop offset="1" stop-color="#f58bb0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe390"/><stop offset="1" stop-color="#ffb04f"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>

    <symbol id="star" viewBox="-1.3 -1.3 2.6 2.6" overflow="visible">
      <path d="M0.000,-1.000 L0.270,-0.372 L0.951,-0.309 L0.437,0.142 L0.588,0.809 L0.000,0.460 L-0.588,0.809 L-0.437,0.142 L-0.951,-0.309 L-0.270,-0.372Z" stroke-width=".32" stroke-linejoin="round"/>
    </symbol>
    <!-- 구름: 바닥이 평평하고 봉우리 두 개 -->
    <g id="cloud">
      <rect x="3" y="21" width="26" height="9" rx="4.5"/>
      <circle cx="11" cy="21.5" r="5.5"/>
      <circle cx="19" cy="19" r="7"/>
      <circle cx="25.2" cy="23.5" r="4.3"/>
    </g>

    <!-- 1. 다듬은 C3: 구름 하이라이트 + 얇은 별자리 + 별 -->
    <symbol id="A" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)"/>
      <path d="M8.5 24.5a4 4 0 0 1 5-3" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4 11.5 9.5 7 15.5 9.2" fill="none" stroke="#b9a6ff" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="4" cy="11.5" r="1.3" fill="#b9a6ff"/><circle cx="9.5" cy="7" r="1.05" fill="#d6caff"/>
      <use href="#star" x="13.5" y="4.5" width="7.5" height="7.5" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- 2. 아치 별자리: 구름 위로 무지개처럼 둥글게 이어진 점 -->
    <symbol id="B" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)" transform="translate(0 1)"/>
      <path d="M4 17C5 10 10 6 16 5.5S25.5 7 27 9.5" fill="none" stroke="#b9a6ff" stroke-width=".9" stroke-dasharray="0 3.2" stroke-linecap="round" opacity="0"/>
      <path d="M4.2 16.5 7 10.6 12 7.2 18 6.2" fill="none" stroke="#b9a6ff" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="4.2" cy="16.5" r="1.1" fill="#b9a6ff"/><circle cx="7" cy="10.6" r="1.2" fill="#c8baff"/><circle cx="12" cy="7.2" r="1.05" fill="#d6caff"/>
      <use href="#halo" x="0" y="0"/>
      <circle cx="22.5" cy="7" r="6" fill="url(#halo)"/>
      <use href="#star" x="18" y="2.5" width="9" height="9" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- 3. 떠오르는 별: 구름에서 별이 올라가며 남긴 점 자취 -->
    <symbol id="C" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)"/>
      <circle cx="18.5" cy="10.5" r=".9" fill="#ffd27a" opacity=".55"/>
      <circle cx="20.2" cy="7.6" r="1.1" fill="#ffd27a" opacity=".75"/>
      <use href="#star" x="19" y="0" width="8.5" height="8.5" fill="url(#gold)" stroke="url(#gold)"/>
      <circle cx="6" cy="9" r="1" fill="#c8baff"/><circle cx="10" cy="5" r=".7" fill="#c8baff" opacity=".8"/>
    </symbol>

    <!-- 4. 봉우리 별자리: 별자리 점이 구름 봉우리에 붙어 있음 (한 덩어리라 작게 써도 좋음) -->
    <symbol id="D" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp2)" transform="translate(0 1)"/>
      <path d="M7 13.5 13 9.5 19.5 11.5" fill="none" stroke="#b9a6ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="13.5" r="1.4" fill="#c8baff"/><circle cx="13" cy="9.5" r="1.2" fill="#d6caff"/>
      <use href="#star" x="19" y="7" width="8" height="8" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- 5. N 별자리: 점 네 개가 N 모양 (이니셜을 숨김) -->
    <symbol id="E" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp)" transform="translate(0 1)"/>
      <path d="M5 14V5.5L13 14V5.5" fill="none" stroke="#b9a6ff" stroke-width=".95" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="5" cy="14" r="1.3" fill="#b9a6ff"/><circle cx="5" cy="5.5" r="1.1" fill="#c8baff"/><circle cx="13" cy="14" r="1.1" fill="#d6caff"/>
      <use href="#star" x="9" y="1.5" width="8" height="8" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- 6. 금빛 별자리: 별자리 전체를 금색으로, 구름은 단색 -->
    <symbol id="F" viewBox="0 0 32 32">
      <use href="#cloud" fill="url(#vp2)"/>
      <path d="M4 12 10 7.5 16.5 9.5 24 4" fill="none" stroke="#ffd27a" stroke-opacity=".7" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="4" cy="12" r="1.2" fill="#ffd27a"/><circle cx="10" cy="7.5" r="1" fill="#ffd27a"/><circle cx="16.5" cy="9.5" r="1.1" fill="#ffd27a"/>
      <use href="#star" x="20" y="0" width="8" height="8" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>
  </defs>
</svg>
<div class="grid" id="grid"></div>
<script>
  const items = [
    ['A', '기본 다듬기', 'C3 그대로 정리. 구름에 하이라이트, 별자리 선은 얇게'],
    ['B', '아치 별자리', '구름 위로 둥글게 이어진 점들 끝에 빛나는 별'],
    ['C', '떠오르는 별', '구름에서 별이 올라가며 남긴 점 자취'],
    ['D', '봉우리 별자리', '별자리를 구름 봉우리 바로 위에 붙여 한 덩어리로'],
    ['E', 'N 별자리', '별자리 점 네 개가 N 모양. 이니셜을 숨겨 둠'],
    ['F', '금빛 별자리', '별자리 전체를 금색으로, 구름은 보라 위주'],
  ]
  const icon = (id, s) => `<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`
  document.getElementById('grid').innerHTML = items.map(([id, name, desc], i) => ['', 'light'].map(theme => `
    <div class="cell ${theme}">
      <h2>${i + 1}. ${name}</h2>
      <div class="mark">${icon(id, 56)}<span>Nebula</span></div>
      <div class="row">${icon(id, 72)}${icon(id, 32)}${icon(id, 16)}<div class="app">${icon(id, 46)}</div><div class="bar">${icon(id, 22)}Nebula</div></div>
      ${theme ? '' : `<div class="tag">${desc}</div>`}
    </div>`).join('')).join('')
</script>
</body></html>
