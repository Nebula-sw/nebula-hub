<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>치노 에셋 시안</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #15121f; color: #f1eef8; }
  h1 { margin: 0; padding: 22px 24px 4px; font-size: 20px; }
  .lead { padding: 0 24px 10px; color: #a29abb; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid #2a2638; }
  .cell.light { background: #f6f3fb; color: #1d1929; border-color: #e3dff0; }
  h2 { margin: 0; font-size: 15px; }
  .desc { font-size: 12px; color: #a29abb; } .light .desc { color: #675f7f; }
  .row { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  /* 1. 승객 칸 모형 */
  .slot { display: flex; align-items: center; gap: 8px; width: 230px; padding: 6px 8px; border-radius: 8px; font-size: 12px;
          background: rgba(245,158,11,.1); box-shadow: inset 0 0 0 1px rgba(245,158,11,.7); }
  .slot b { font-weight: 600; } .slot small { display: block; color: #9a93b0; } .light .slot small { color: #675f7f; }
  .badge { margin-left: auto; background: #f59e0b; color: #fff; border-radius: 4px; padding: 0 4px; font-size: 11px; }
  /* 2. 알림창 모형 */
  .alert { position: relative; width: 300px; margin-top: 46px; padding: 18px; border-radius: 16px; background: #201c2e; border: 1px solid #3a3450; font-size: 13px; }
  .light .alert { background: #fff; border-color: #e3dff0; }
  .alert .peek { position: absolute; left: 50%; top: -52px; transform: translateX(-50%); }
  .alert button { margin-top: 14px; width: 100%; border: 0; border-radius: 10px; padding: 9px; background: #7f65e3; color: #fff; font-weight: 700; font: inherit; }
  /* 3. 빈 화면 모형 */
  .empty { width: 300px; padding: 22px 16px 0; border-radius: 14px; border: 1px dashed #3a3450; text-align: center; font-size: 13px; color: #a29abb; overflow: hidden; }
  .light .empty { border-color: #d8d2e6; color: #675f7f; }
  .empty svg { display: block; margin: 12px auto 0; }
  /* 4. 완료 축하 모형 */
  .toast { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 8px; border-radius: 14px; background: #1b2b22; border: 1px solid #2f6b4c; font-size: 14px; font-weight: 700; color: #6ee7a8; }
  .light .toast { background: #eafaf1; border-color: #9fdcbc; color: #157a4a; }
  /* 5. 허브 제목 모형 */
  .hero { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 900; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6ead8"/><stop offset="1" stop-color="#ecd9be"/></linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1dcc0"/><stop offset="1" stop-color="#e2c29c"/></linearGradient>
    <radialGradient id="muzzle" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7efe4"/></radialGradient>

    <!-- 치노 얼굴 (viewBox 0 0 100 80). 크림색 털 · 옆으로 퍼진 귀 · 흰 주둥이 · 동그란 갈색 눈 · 짙은 코 -->
    <g id="ears">
      <!-- 옆으로 퍼지며 살짝 처진 복슬 귀 (아래 가장자리 털 결) -->
      <path d="M30 27 C20 21 8 22 4 30 C1 37 3 46 6 52 C8 50 9 53 11 55 C12 52 14 55 16 56 C17 53 19 55 21 55 C25 48 28 38 30 27 Z" fill="url(#ear)"/>
      <path d="M70 27 C80 21 92 22 96 30 C99 37 97 46 94 52 C92 50 91 53 89 55 C88 52 86 55 84 56 C83 53 81 55 79 55 C75 48 72 38 70 27 Z" fill="url(#ear)"/>
      <path d="M86 32 C91 33 93 39 91 46 C88 43 86 38 86 32 Z" fill="#f2b9a8" opacity=".45"/>
      <path d="M14 32 C9 33 7 39 9 46 C12 43 14 38 14 32 Z" fill="#f2b9a8" opacity=".3"/>
    </g>
    <g id="face-base">
      <use href="#ears"/>
      <!-- 머리: 넓고 둥근 얼굴, 위쪽은 보송한 털 결 -->
      <path d="M50 20 C55 18 60 19 64 21 C74 24 82 33 82 46 C82 62 68 73 50 73 C32 73 18 62 18 46 C18 33 26 24 36 21 C40 19 45 18 50 20 Z" fill="url(#fur)"/>
      <path d="M40 21 q3 -3 5 0 q3 -3 5 0 q3 -3 5 0 q3 -3 5 0" fill="none" stroke="#f7ecdc" stroke-width="2" stroke-linecap="round"/>
      <!-- 미간의 얇은 흰 줄 + 넓은 흰 주둥이 -->
      <path d="M50 30 C52.5 34 53 40 54 45 L46 45 C47 40 47.5 34 50 30 Z" fill="#fffaf3" opacity=".9"/>
      <path d="M50 44 C59 44 66 49 66 57 C66 66 59 71 50 71 C41 71 34 66 34 57 C34 49 41 44 50 44 Z" fill="url(#muzzle)"/>
      <!-- 입가 회색 털 -->
      <ellipse cx="50" cy="64.5" rx="8" ry="3.8" fill="#8d7f78" opacity=".4"/>
      <!-- 코 -->
      <path d="M44 54.5 C44 50.8 46.8 50 50 50 C53.2 50 56 50.8 56 54.5 C56 57.8 52.8 59.5 50 59.5 C47.2 59.5 44 57.8 44 54.5 Z" fill="#3a2c2c"/>
      <ellipse cx="47.8" cy="52.3" rx="1.7" ry=".9" fill="#fff" opacity=".45"/>
      <!-- 수염 -->
      <path d="M37 59 l-11 -2 M37 62 l-10 1 M63 59 l11 -2 M63 62 l10 1" stroke="#ffffff" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    </g>
    <!-- 눈: 기본(동그랗게) -->
    <g id="eyes-open">
      <circle cx="38" cy="44" r="6.2" fill="#1f130c"/><circle cx="62" cy="44" r="6.2" fill="#1f130c"/>
      <circle cx="38" cy="44.3" r="4.6" fill="#4a2e1d"/><circle cx="62" cy="44.3" r="4.6" fill="#4a2e1d"/>
      <circle cx="40" cy="42" r="1.9" fill="#fff"/><circle cx="64" cy="42" r="1.9" fill="#fff"/>
      <circle cx="36.6" cy="46.5" r=".8" fill="#fff" opacity=".7"/><circle cx="60.6" cy="46.5" r=".8" fill="#fff" opacity=".7"/>
    </g>
    <!-- 눈: 웃는 눈 (^ ^) -->
    <g id="eyes-happy" fill="none" stroke="#2c1b12" stroke-width="2.6" stroke-linecap="round">
      <path d="M32.5 45.5 Q38 39.5 43.5 45.5"/><path d="M56.5 45.5 Q62 39.5 67.5 45.5"/>
    </g>
    <!-- 눈: 졸린 눈 -->
    <g id="eyes-sleepy">
      <path d="M32.5 44 Q38 48 43.5 44" fill="none" stroke="#2c1b12" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M56.5 44 Q62 48 67.5 44" fill="none" stroke="#2c1b12" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- 유모차 (덮개 + 앞 테두리) -->
    <g id="canopy"><path d="M6 46 C8 16 30 4 52 4 C76 4 94 18 96 44 Z" fill="#6c6670"/><path d="M14 40 C17 20 33 10 52 10 C72 10 86 22 88 40" fill="none" stroke="#57525c" stroke-width="2"/></g>
    <g id="bar"><rect x="0" y="62" width="100" height="14" rx="7" fill="#222029"/><rect x="6" y="64.5" width="88" height="2.6" rx="1.3" fill="#ffffff" opacity=".22"/></g>

    <!-- ① 승객 아이콘: 유모차 탄 치노 (작게 써도 보이게 단순화) -->
    <symbol id="chino-passenger" viewBox="0 0 100 80">
      <use href="#canopy"/>
      <g transform="translate(0 6)"><use href="#face-base"/><use href="#eyes-open"/></g>
      <use href="#bar" transform="translate(0 2)"/>
    </symbol>

    <!-- ② 알림창 위에서 빼꼼 (얼굴 + 앞발) -->
    <symbol id="chino-peek" viewBox="0 0 100 80">
      <g transform="translate(0 4)"><use href="#face-base"/><use href="#eyes-open"/></g>
      <ellipse cx="33" cy="76" rx="8" ry="5" fill="#fffaf3"/><ellipse cx="67" cy="76" rx="8" ry="5" fill="#fffaf3"/>
      <path d="M30 78 v-3 M33 78.5 v-3.5 M36 78 v-3 M64 78 v-3 M67 78.5 v-3.5 M70 78 v-3" stroke="#e2c29c" stroke-width="1" stroke-linecap="round"/>
    </symbol>

    <!-- ③ 빈 화면: 졸린 치노가 아래에서 올라옴 + 물음표 -->
    <symbol id="chino-empty" viewBox="0 0 100 80">
      <g transform="translate(0 10)"><use href="#face-base"/><use href="#eyes-sleepy"/></g>
      <text x="84" y="20" font-size="18" font-weight="800" fill="#b09dfc" font-family="system-ui">?</text>
      <text x="91" y="9" font-size="10" font-weight="800" fill="#b09dfc" opacity=".6" font-family="system-ui">?</text>
    </symbol>

    <!-- ④ 완료 축하: 웃는 치노 + 혀 + 색종이 -->
    <symbol id="chino-happy" viewBox="0 0 100 80">
      <g transform="translate(0 4)">
        <use href="#face-base"/><use href="#eyes-happy"/>
        <path d="M46 66 Q50 74 54 66 Z" fill="#ef7f99"/>
        <ellipse cx="31" cy="55" rx="4" ry="2.4" fill="#f4a3b5" opacity=".6"/><ellipse cx="69" cy="55" rx="4" ry="2.4" fill="#f4a3b5" opacity=".6"/>
      </g>
      <rect x="6" y="6" width="5" height="3" rx="1" fill="#9680f2" transform="rotate(-20 8 7)"/>
      <rect x="86" y="8" width="5" height="3" rx="1" fill="#f0709c" transform="rotate(25 88 9)"/>
      <circle cx="16" cy="18" r="1.8" fill="#ffd27a"/><circle cx="90" cy="22" r="1.8" fill="#5ED9B2"/><circle cx="80" cy="4" r="1.4" fill="#ffd27a"/>
    </symbol>

    <!-- ⑤ 허브 마스코트: Nebula 구름 뒤에서 치노가 빼꼼 -->
    <symbol id="chino-cloud" viewBox="0 0 100 100">
      <g transform="translate(0 2)"><use href="#face-base"/><use href="#eyes-open"/></g>
      <defs><linearGradient id="nb" gradientUnits="userSpaceOnUse" x1="0" y1="55" x2="100" y2="100"><stop offset="0" stop-color="#9a7cff"/><stop offset="1" stop-color="#f0709c"/></linearGradient></defs>
      <g fill="url(#nb)"><rect x="4" y="70" width="92" height="28" rx="14"/><circle cx="26" cy="72" r="15"/><circle cx="52" cy="66" r="18"/><circle cx="76" cy="73" r="13"/></g>
      <path transform="translate(80 84) scale(5)" fill="#fff" stroke="#fff" stroke-width=".32" stroke-linejoin="round" d="M0-1 .27-.372.951-.309.437.142.588.809 0 .46-.588.809-.437.142-.951-.309-.27-.372Z"/>
      <path transform="translate(80 84) scale(4)" fill="#ffc35c" stroke="#ffc35c" stroke-width=".32" stroke-linejoin="round" d="M0-1 .27-.372.951-.309.437.142.588.809 0 .46-.588.809-.437.142-.951-.309-.27-.372Z"/>
    </symbol>
  </defs>
</svg>
<h1>치노 에셋 시안</h1>
<div class="lead">사진 속 치노 특징: 크림색 털 · 옆으로 퍼진 귀 · 흰 주둥이 · 동그란 갈색 눈 · 짙은 코 · 입가 회색 털 · 유모차 테두리에 턱 걸치기</div>
<div id="root"></div>
<script>
const s = (id, w, h = w * 0.8) => `<svg width="${w}" height="${h}"><use href="#${id}"/></svg>`
const sections = [
  ['① 버스 승객 아이콘 (유모차 탄 치노)', '승객 칸의 🚌 자리. 16·20·32·64px', () => `
    <div class="row">${s('chino-passenger', 64)}${s('chino-passenger', 32)}${s('chino-passenger', 20)}${s('chino-passenger', 16)}</div>
    <div class="slot">${s('chino-passenger', 26)}<span><b>무야호부캐</b><small>성운 · 워로드</small></span><span class="badge">승객</span></div>`],
  ['② 공용 알림창', '모든 사이트 알림창 위에 턱 걸치고 빼꼼', () => `
    <div class="alert"><span class="peek">${s('chino-peek', 90)}</span>이 공대에는 이미 승객(무야호부캐)이 있어요.<br>버스는 공대당 승객 1명만 가능해요.<button>확인</button></div>`],
  ['③ 빈 화면 · 오류', '"조건에 맞는 캐릭터가 없어요" 같은 곳', () => `
    <div class="empty">조건에 맞는 캐릭터가 없어요${s('chino-empty', 120)}</div>`],
  ['④ 공대 완료 축하', '[✓ 완료]를 누르면 잠깐 뜨는 토스트', () => `
    <div class="toast">${s('chino-happy', 54)} 수고했어요! 3공대 완료</div>${s('chino-happy', 110)}`],
  ['⑤ 허브 마스코트', 'Nebula 구름 뒤에서 치노가 빼꼼', () => `
    <div class="hero">${s('chino-cloud', 72, 72)} Nebula</div>${s('chino-cloud', 130, 130)}`],
]
document.getElementById('root').innerHTML = sections.map(([t, d, f]) => `<div class="grid">${['', 'light'].map((th) => `
  <div class="cell ${th}"><h2>${t}</h2>${th ? '' : `<div class="desc">${d}</div>`}${f()}</div>`).join('')}</div>`).join('')
</script>
</body></html>
