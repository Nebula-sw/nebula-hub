<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Nebula 공유 썸네일</title>
<!-- 카톡 등 공유 썸네일(1200×630) 원본. ?d=설명 으로 사이트별 문구만 바꿔서 캡처 (docs/og/make.mjs) -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background:
      radial-gradient(ellipse 520px 340px at 78% 18%, rgba(240, 112, 156, .32), transparent 70%),
      radial-gradient(ellipse 600px 380px at 18% 88%, rgba(139, 108, 246, .38), transparent 70%),
      radial-gradient(ellipse 380px 260px at 50% 46%, rgba(154, 124, 255, .18), transparent 70%),
      #120e20;
    color: #f3f0fa; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  canvas { position: absolute; inset: 0; }
  .logo { width: 230px; height: 230px; position: relative; filter: drop-shadow(0 18px 40px rgba(240, 112, 156, .35)); }
  h1 { position: relative; margin: 8px 0 0; font-size: 76px; font-weight: 800; letter-spacing: -.02em; }
  p { position: relative; margin: 14px 0 0; font-size: 30px; color: #c9c0e3; }
</style></head><body>
<canvas id="stars" width="1200" height="630"></canvas>
<img class="logo" src="../../public/logo.svg" alt="">
<h1>Nebula</h1>
<p id="desc"></p>
<script>
  document.getElementById('desc').textContent = new URLSearchParams(location.search).get('d') || ''
  // 배경 별빛 점 (항상 같은 모양이 나오게 고정된 난수)
  const ctx = document.getElementById('stars').getContext('2d')
  let seed = 7
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
  for (let i = 0; i < 90; i++) {
    const x = rand() * 1200, y = rand() * 630, r = rand() * 1.6 + .3
    if (Math.hypot(x - 600, y - 300) < 300) continue // 가운데 글자 주변은 비움
    ctx.globalAlpha = .25 + rand() * .55
    ctx.fillStyle = rand() > .8 ? '#ffd27a' : '#fff'
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill()
  }
</script>
</body></html>
