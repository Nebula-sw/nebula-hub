<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Nebula 로고 시안 5</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #0f0d16; color: #f1eef8; }
  h1 { margin: 0; padding: 22px 24px 6px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 22px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; border-bottom: 1px solid #221e30; }
  .cell.light { background: #f6f3fb; color: #1d1929; border-color: #e3dff0; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
  .tag { font-size: 13px; color: #9a93b0; text-align: center; }
  .row { display: flex; gap: 18px; align-items: center; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; padding: 8px 12px; border-radius: 8px; background: #15121f; color: #f1eef8; }
  .light .bar { background: #fff; color: #1d1929; box-shadow: 0 0 0 1px #e3dff0; }
  .app { width: 64px; height: 64px; border-radius: 15px; background: #15121f; display: grid; place-items: center; box-shadow: 0 0 0 1px #2a2638; }
  .light .app { background: #fff; box-shadow: 0 0 0 1px #e3dff0; }
  h2 { margin: 0; font-size: 15px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 32칸 좌표 기준 그라데이션 (여러 도형에 걸쳐 한 장처럼 이어지게 userSpaceOnUse) -->
    <linearGradient id="vp" gradientUnits="userSpaceOnUse" x1="2" y1="4" x2="30" y2="30"><stop offset="0" stop-color="#8b6cf6"/><stop offset="1" stop-color="#f0709c"/></linearGradient>
    <linearGradient id="vpSoft" gradientUnits="userSpaceOnUse" x1="2" y1="10" x2="30" y2="30"><stop offset="0" stop-color="#a48cff"/><stop offset="1" stop-color="#ff8fb3"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>

    <!-- 둥근 다섯 갈래 별 (모서리를 둥글게 해서 부드럽게) -->
    <symbol id="star" viewBox="-1.3 -1.3 2.6 2.6" overflow="visible">
      <path d="M0.000,-1.000 L0.270,-0.372 L0.951,-0.309 L0.437,0.142 L0.588,0.809 L0.000,0.460 L-0.588,0.809 L-0.437,0.142 L-0.951,-0.309 L-0.270,-0.372Z" stroke-width=".32" stroke-linejoin="round"/>
    </symbol>
    <!-- 구름 기본형 (원 3개 + 둥근 바닥) -->
    <g id="cloudShape">
      <rect x="3" y="16" width="26" height="11" rx="5.5"/>
      <circle cx="10.5" cy="17" r="6"/>
      <circle cx="18.5" cy="13.5" r="7.5"/>
      <circle cx="25" cy="18.5" r="4.5"/>
    </g>
    <mask id="cloudStarCut">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#star" x="13" y="13" width="10" height="10" fill="#000" stroke="#000"/>
      <circle cx="9.5" cy="21.5" r="1.3" fill="#000"/><circle cx="24" cy="22" r="1" fill="#000"/>
    </mask>

    <!-- C1. 구름 + 떠오르는 별 -->
    <symbol id="C1" viewBox="0 0 32 32">
      <use href="#cloudShape" fill="url(#vp)" transform="translate(0 3)"/>
      <use href="#star" x="18" y="0" width="13" height="13" fill="url(#gold)" stroke="url(#gold)"/>
      <path d="M8 23.5c2-2 5-2 7 0" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.4" stroke-linecap="round" transform="translate(0 1)"/>
    </symbol>

    <!-- C2. 별을 품은 구름 (별 모양으로 구멍) -->
    <symbol id="C2" viewBox="0 0 32 32">
      <g mask="url(#cloudStarCut)"><use href="#cloudShape" fill="url(#vp)" transform="translate(0 1)"/></g>
    </symbol>

    <!-- C3. 구름 위 별자리 -->
    <symbol id="C3" viewBox="0 0 32 32">
      <use href="#cloudShape" fill="url(#vp)" transform="translate(0 4) scale(1 .92)"/>
      <path d="M5 8 11 4.5 17 7" fill="none" stroke="#b9a6ff" stroke-width="1" stroke-linecap="round"/>
      <circle cx="5" cy="8" r="1.4" fill="#b9a6ff"/><circle cx="11" cy="4.5" r="1.1" fill="#d9ccff"/>
      <use href="#star" x="14" y="3.5" width="7" height="7" fill="#ffd27a" stroke="#ffd27a"/>
    </symbol>

    <!-- N1. 리본 N + 구름 + 별 -->
    <symbol id="N1" viewBox="0 0 32 32">
      <path d="M6 6.5A2.5 2.5 0 0 1 8.5 4h1A2.5 2.5 0 0 1 12 6.5V24H6Z" fill="#8b6cf6"/>
      <path d="M20 9h6v13h-6Z" fill="#f0709c"/>
      <path d="M6 4h6l14 20h-6Z" fill="url(#vp)"/>
      <use href="#star" x="17.5" y="0" width="11" height="11" fill="url(#gold)" stroke="url(#gold)"/>
      <g fill="#c7b8ff"><rect x="1.5" y="23" width="29" height="7" rx="3.5"/><circle cx="8" cy="23.5" r="4"/><circle cx="14.5" cy="22" r="4.5"/><circle cx="22" cy="23.5" r="3.6"/></g>
    </symbol>

    <!-- N2. 구름 속 N (구름에 N을 뚫음) -->
    <symbol id="N2" viewBox="0 0 32 32">
      <mask id="nCut"><rect width="32" height="32" fill="#fff"/>
        <path d="M10 26V14l12 12V14" fill="none" stroke="#000" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></mask>
      <g mask="url(#nCut)"><use href="#cloudShape" fill="url(#vp)" transform="translate(0 2)"/></g>
      <use href="#star" x="22" y="1" width="9" height="9" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- N3. 리본 N, 오른쪽 기둥 끝이 별 -->
    <symbol id="N3" viewBox="0 0 32 32">
      <path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h1A2.5 2.5 0 0 1 11 6.5V28H5Z" fill="#8b6cf6"/>
      <path d="M21 12h6v13.5A2.5 2.5 0 0 1 24.5 28h-1A2.5 2.5 0 0 1 21 25.5Z" fill="#f0709c"/>
      <path d="M5 4h6l16 24h-6Z" fill="url(#vp)"/>
      <use href="#star" x="18.5" y="1" width="11" height="11" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- W1. 물결 N, 끝에 별 -->
    <symbol id="W1" viewBox="0 0 32 32">
      <path d="M6 27V11c0-4 4-5 6-2l8 13c2 3.5 6 2.5 6-1.5V11" fill="none" stroke="url(#vp)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#star" x="20" y="0" width="12" height="12" fill="url(#gold)" stroke="url(#gold)"/>
    </symbol>

    <!-- W2. 구름에서 피어오르는 물결 N -->
    <symbol id="W2" viewBox="0 0 32 32">
      <path d="M7 24V10c0-4 4-5 6-2l7 12c2 3.5 5.5 2.5 5.5-1.5V6" fill="none" stroke="url(#vp)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#c7b8ff"><rect x="1.5" y="23" width="29" height="7" rx="3.5"/><circle cx="7" cy="23.5" r="3.8"/><circle cx="14" cy="22.5" r="4.3"/><circle cx="22.5" cy="24" r="3.4"/></g>
      <circle cx="25.5" cy="4" r="2.2" fill="#ffd27a"/>
      <circle cx="29" cy="9" r="1" fill="#ffd27a" opacity=".8"/>
    </symbol>

    <!-- W3. 구름 꼬리 N: 굵은 획 + 따라오는 얇은 획 두 줄 + 별 -->
    <symbol id="W3" viewBox="0 0 32 32">
      <path d="M5 27V11c0-4 4-5 6-2l8 13c2 3.5 6 2.5 6-1.5V8" fill="none" stroke="url(#vp)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 27V17" stroke="#a48cff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 13v6" stroke="#ff8fb3" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
      <use href="#star" x="21" y="0" width="8" height="8" fill="url(#gold)" stroke="url(#gold)"/>
      <circle cx="16" cy="5" r="1" fill="#ffd27a"/>
    </symbol>
  </defs>
</svg>
<div id="root"></div>
<script>
  const groups = [
    ['구름 + 별', [
      ['C1', '구름 위로 뜨는 별', '보라·분홍 구름 뒤로 노란 별이 떠오름. 가장 직관적'],
      ['C2', '별을 품은 구름', '구름에 별 모양 구멍. 작게 써도 한 덩어리로 보임'],
      ['C3', '구름 위 별자리', '구름 위로 점 두 개 + 별이 이어진 작은 별자리'],
    ]],
    ['리본 N + 구름·별', [
      ['N1', '구름 위 리본 N', '리본 N이 구름에서 솟아오르고 끝에 별'],
      ['N2', '구름 속 N', '구름에 N을 뚫어 새김 + 별'],
      ['N3', '별 끝 리본 N', '오른쪽 기둥 끝이 별. 가장 깔끔한 N'],
    ]],
    ['물결 N + 구름·별', [
      ['W1', '별을 향한 물결 N', '한 획 N의 끝에 별이 걸림'],
      ['W2', '구름에서 피어오르는 N', '구름 사이로 흐르는 N + 별빛 점'],
      ['W3', '꼬리 달린 물결 N', '굵은 획 옆에 얇은 꼬리 획 = 흐르는 성운 + 별'],
    ]],
  ]
  const icon = (id, s) => `<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`
  document.getElementById('root').innerHTML = groups.map(([title, items]) => `<h1>${title}</h1><div class="grid">` + items.map(([id, name, desc]) => ['', 'light'].map(theme => `
    <div class="cell ${theme}">
      <h2>${id}. ${name}</h2>
      <div class="mark">${icon(id, 52)}<span>Nebula</span></div>
      <div class="row">${icon(id, 68)}${icon(id, 32)}${icon(id, 16)}<div class="app">${icon(id, 44)}</div><div class="bar">${icon(id, 20)}Nebula</div></div>
      ${theme ? '' : `<div class="tag">${desc}</div>`}
    </div>`).join('')).join('') + '</div>').join('')
</script>
</body></html>
