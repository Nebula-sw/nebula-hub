<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula</title>
    <meta name="description" content="게임 도우미 사이트 모음" />
    <!-- 탭 아이콘 · 홈 화면 아이콘 · 카톡 등 공유 썸네일 (이미지 원본: docs/og/) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nebula" />
    <meta property="og:title" content="Nebula" />
    <meta property="og:description" content="게임 도우미 사이트 모음" />
    <meta property="og:url" content="https://nebula.kim/" />
    <meta property="og:image" content="https://nebula.kim/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // 저장된 화면 모드를 그리기 전에 적용 (깜빡임 방지). 바꾸는 화면은 맨 위 바의 [테마] 버튼(switcher.js)
      try {
        const t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
    <style>
      /* nebula.kim 첫 화면: sites.json 의 사이트들을 카드로 보여줌 */
      :root {
        color-scheme: dark;
        --bg: #15121f;
        --card: #201c2e;
        --border: #2f2a40;
        --fg: #f3f0fa;
        --muted: #a29abb;
        --accent: #9680f2;
        /* 맨 위 전환 바 색 (switcher.js 가 읽음) */
        --nebula-bar-bg: #0f0d16;
        --nebula-bar-fg: #f1eef8;
        --nebula-bar-muted: #9a93b0;
        --nebula-bar-border: #2a2638;
        --nebula-bar-active: #2a2638;
      }
      /* 라이트 모드: 맨 위 바에서 '라이트'를 골랐거나, '시스템'인데 기기가 라이트 모드일 때 */
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f6f3fb;
        --card: #ffffff;
        --border: #e3dff0;
        --fg: #1d1929;
        --muted: #675f7f;
        --nebula-bar-bg: #ffffff;
        --nebula-bar-fg: #1d1929;
        --nebula-bar-muted: #675f7f;
        --nebula-bar-border: #e3dff0;
        --nebula-bar-active: #ece8f6;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          color-scheme: light;
          --bg: #f6f3fb;
          --card: #ffffff;
          --border: #e3dff0;
          --fg: #1d1929;
          --muted: #675f7f;
          --nebula-bar-bg: #ffffff;
          --nebula-bar-fg: #1d1929;
          --nebula-bar-muted: #675f7f;
          --nebula-bar-border: #e3dff0;
          --nebula-bar-active: #ece8f6;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        background: radial-gradient(ellipse at 80% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%), var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      }
      main { max-width: 880px; margin: 0 auto; padding: 72px 20px; }
      h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.02em; }
      h1 { display: flex; align-items: center; gap: 14px; }
      h1 img { width: 64px; height: 64px; }
      .lead { margin-top: 10px; color: var(--muted); }
      .grid { margin-top: 36px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      a.card {
        display: block; padding: 20px; border-radius: 16px; background: var(--card);
        border: 1px solid var(--border); color: inherit; text-decoration: none;
        border-left: 4px solid var(--c); transition: transform 0.15s, border-color 0.15s;
      }
      a.card:hover { transform: translateY(-2px); border-color: var(--c); }
      .card .game { font-size: 12px; color: var(--muted); }
      .card .name { margin-top: 4px; font-size: 20px; font-weight: 800; }
      .card .desc { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.5; }
      .card .url { margin-top: 12px; font-size: 12px; color: var(--c); }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="/logo.svg" alt=""> Nebula</h1>
      <p class="lead">게임 도우미 사이트 모음</p>
      <div class="grid" id="sites"></div>
    </main>
    <script>
      // sites.json 을 읽어서 카드로 그림 (새 사이트는 sites.json 에만 추가하면 여기에도 자동으로 나옴)
      fetch('/sites.json', { cache: 'no-cache' })
        .then((r) => r.json())
        .then((sites) => {
          const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
          document.getElementById('sites').innerHTML = sites
            .map(
              (s) => `<a class="card" href="${esc(s.url)}" style="--c:${esc(s.color || '#888')}">
                <div class="name">${esc(s.game || s.name)}</div>
                <div class="desc">${esc(s.description)}</div>
                <div class="url">${esc(new URL(s.url).host)} →</div>
              </a>`,
            )
            .join('')
        })
    </script>
    <!-- 이 페이지에도 맨 위 전환 바 -->
    <script src="/switcher.js" defer></script>
  </body>
</html>
